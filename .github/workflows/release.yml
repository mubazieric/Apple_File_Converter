name: Release build

# Builds distributable artefacts. Signing material is provided through repository
# secrets and is never committed. See docs/RELEASE_CHECKLIST.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_android:
        description: Build signed Android App Bundle
        type: boolean
        default: true
      build_ios:
        description: Build signed iOS IPA
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    name: Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # `secrets` is not available in step-level `if:` expressions, so these
      # steps are always run but no-op when the signing secret is absent.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; the build will use debug signing."
          fi
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "Signing secrets not set; skipping android/key.properties."
          fi
      - name: Build AAB
        run: >
          flutter build appbundle --release
          --dart-define=ENABLE_ADS=${{ secrets.ADMOB_ANDROID_BANNER_ID != '' }}
          --dart-define=ADMOB_ANDROID_BANNER=${{ secrets.ADMOB_ANDROID_BANNER_ID }}
          --dart-define=ADMOB_ANDROID_NATIVE=${{ secrets.ADMOB_ANDROID_NATIVE_ID }}
          --dart-define=ADMOB_ANDROID_INTERSTITIAL=${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
          --dart-define=ADMOB_ANDROID_REWARDED=${{ secrets.ADMOB_ANDROID_REWARDED_ID }}
      - name: Build split APKs (internal testing)
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=ENABLE_ADS=${{ secrets.ADMOB_ANDROID_BANNER_ID != '' }}
          --dart-define=ADMOB_ANDROID_BANNER=${{ secrets.ADMOB_ANDROID_BANNER_ID }}
          --dart-define=ADMOB_ANDROID_NATIVE=${{ secrets.ADMOB_ANDROID_NATIVE_ID }}
          --dart-define=ADMOB_ANDROID_INTERSTITIAL=${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
          --dart-define=ADMOB_ANDROID_REWARDED=${{ secrets.ADMOB_ANDROID_REWARDED_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios }}
    name: iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # device_info_plus calls NSProcessInfo.isiOSAppOnVision, which only exists
      # in the Xcode 26.1+ SDK. macOS-14 images ship Xcode 16 and fail to compile.
      - name: Select newest available Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -E 'Xcode_[0-9]' | sort -V | tail -n 1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Use CocoaPods instead of Flutter Swift Package Manager
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "IOS_DISTRIBUTION_CERT_P12 not set; skipping certificate import."
            exit 0
          fi
          echo "$CERT_P12" | base64 -d > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$PROVISIONING_PROFILE" ]; then
            echo "IOS_PROVISIONING_PROFILE not set; skipping provisioning profile install."
            exit 0
          fi
          echo "$PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build IPA
        run: >
          flutter build ipa --release
          --export-method=app-store
          --dart-define=ENABLE_ADS=${{ secrets.ADMOB_IOS_BANNER_ID != '' }}
          --dart-define=ADMOB_IOS_BANNER=${{ secrets.ADMOB_IOS_BANNER_ID }}
          --dart-define=ADMOB_IOS_NATIVE=${{ secrets.ADMOB_IOS_NATIVE_ID }}
          --dart-define=ADMOB_IOS_INTERSTITIAL=${{ secrets.ADMOB_IOS_INTERSTITIAL_ID }}
          --dart-define=ADMOB_IOS_REWARDED=${{ secrets.ADMOB_IOS_REWARDED_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
